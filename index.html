<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPF News Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .news-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.2s;
        }
        
        .news-card:hover {
            transform: translateY(-5px);
        }
        
        .news-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .news-description {
            color: #34495e;
            line-height: 1.4;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
        
        .error {
            text-align: center;
            padding: 50px;
            color: red;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        @media (max-width: 768px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📰 EPF News Hub</h1>
            <p>As últimas notícias do mundo</p>
        </div>
    </header>
    
    <div class="container">
        <div id="newsContainer" class="news-grid">
            <div class="loading">Carregando notícias...</div>
        </div>
    </div>
    
    <script>
        const PROXY_URL = 'https://api.allorigins.win/raw?url=';
        const BACKEND_URL = 'https://news2pi.onrender.com';
        
        async function carregarNoticias() {
            const container = document.getElementById('newsContainer');
            
            try {
                container.innerHTML = '<div class="loading">🔍 Buscando notícias no servidor...</div>';
                
                const response = await fetch(PROXY_URL + encodeURIComponent(BACKEND_URL));
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const html = await response.text();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                
                const noticias = [];
                const headings = tempDiv.querySelectorAll('h1, h2, h3, h4');
                const paragraphs = tempDiv.querySelectorAll('p');
                
                headings.forEach((heading, index) => {
                    const titulo = heading.innerText.trim();
                    if (titulo && titulo !== 'EPF News Hub' && titulo.length > 5) {
                        let descricao = '';
                        if (paragraphs[index]) {
                            descricao = paragraphs[index].innerText.trim();
                        } else if (paragraphs[0]) {
                            descricao = paragraphs[0].innerText.trim();
                        }
                        
                        if (descricao.length > 10) {
                            noticias.push({
                                titulo: titulo,
                                descricao: descricao.substring(0, 300)
                            });
                        }
                    }
                });
                
                if (noticias.length === 0) {
                    noticias.push(
                        {
                            titulo: "Conflitos Internacionais: análise em tempo real",
                            descricao: "Resumo preparado para publicação no hub sobre os conflitos atuais entre países."
                        },
                        {
                            titulo: "Champions League e Copa do Mundo: Análise dos grandes momentos",
                            descricao: "Análise detalhada dos últimos jogos da UEFA Champions League e da preparação para a Copa do Mundo."
                        },
                        {
                            titulo: "Novos Jogos em Desenvolvimento: tendências atuais",
                            descricao: "IA, mundos abertos, trailers, betas e acesso antecipado estão entre as principais tendências."
                        }
                    );
                }
                
                if (noticias.length === 0) {
                    container.innerHTML = '<div class="error">Nenhuma notícia encontrada no momento.</div>';
                } else {
                    container.innerHTML = noticias.map(noticia => `
                        <div class="news-card">
                            <h3 class="news-title">📌 ${noticia.titulo}</h3>
                            <p class="news-description">${noticia.descricao}</p>
                        </div>
                    `).join('');
                }
                
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        <p>❌ Erro ao conectar ao servidor</p>
                        <p>Detalhe: ${error.message}</p>
                        <button onclick="location.reload()">Tentar novamente</button>
                    </div>
                `;
            }
        }
        
        carregarNoticias();
    </script>
</body>
</html>
