<!DOCTYPE html>
<html>
<head>
    <title>Submeter Notícia</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 8px; width: 500px; }
        h1 { margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #1a1a2e; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2a2a4e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Submeter Notícia</h1>
        <form action="/publish" method="post">
            <input type="text" name="title" placeholder="Título" required>
            <textarea name="content" placeholder="Conteúdo" rows="5" required></textarea>
            <select name="category">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
