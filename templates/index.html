<!DOCTYPE html>
<html>
<head>
    <title>News2PI</title>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; display: flex; gap: 20px; }
        .sidebar { width: 250px; background: white; padding: 15px; border-radius: 8px; }
        .sidebar h3 { margin-bottom: 10px; }
        .sidebar ul { list-style: none; }
        .sidebar li { padding: 8px; cursor: pointer; border-radius: 5px; }
        .sidebar li:hover { background: #e0e0e0; }
        .sidebar .active { background: #1a1a2e; color: white; }
        .content { flex: 1; }
        .article { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .article h2 { margin-bottom: 10px; color: #1a1a2e; }
        .article .meta { color: #666; font-size: 14px; margin-bottom: 10px; }
        .article .category { display: inline-block; background: #e0e0e0; padding: 2px 10px; border-radius: 15px; font-size: 12px; }
        .article .summary { margin-top: 10px; line-height: 1.5; }
        .article a { color: #1a1a2e; text-decoration: none; }
        .article a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>📰 News2PI</h1>
        <p>Portal de Notícias com IA</p>
    </header>
    <div class="container">
        <div class="sidebar">
            <h3>Categorias</h3>
            <ul>
                {% for cat in categories %}
                <li onclick="filterByCategory('{{ cat }}')">{{ cat }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="content" id="articles-container">
            {% for article in articles %}
            <div class="article" data-category="{{ article.category }}">
                <h2><a href="{{ article.url }}" target="_blank">{{ article.title }}</a></h2>
                <div class="meta">
                    <span class="category">{{ article.category }}</span>
                    <span>Fonte: {{ article.source }}</span>
                    <span>{{ article.timestamp[:10] }}</span>
                </div>
                <div class="summary">{{ article.content[:300] }}...</div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script>
        function filterByCategory(category) {
            const articles = document.querySelectorAll('.article');
            articles.forEach(article => {
                if (category === 'Todas' || article.dataset.category === category) {
                    article.style.display = 'block';
                } else {
                    article.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
